name: Build iNextOS for LYT T68M

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      # 仅自动记录上游指纹的提交：镜像内容不变，无需重建
      - 'last-upstream-sha'
  schedule:
    # 每日 03:00（CST / UTC+8）检查上游框架是否更新，有更新则自动编译最新固件
    - cron: '0 19 * * *'

jobs:
  # ── 上游跟踪：比对 jjm2473/armbian-easepi 的 easepi-v26.02 分支 HEAD ──
  upstream:
    name: Check upstream framework (armbian-easepi)
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # 需要把新的上游指纹提交回仓库
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4

      - name: Compare upstream HEAD with recorded sha
        id: cmp
        run: |
          set -eu
          UP=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jjm2473/armbian-easepi/branches/easepi-v26.02" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          OLD=$(cat last-upstream-sha 2>/dev/null | tr -d '\n' || echo none)
          echo "上游 easepi-v26.02 HEAD : $UP"
          echo "本仓库记录的指纹         : $OLD"
          if [ "$UP" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化，跳过构建。"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "sha=$UP"       >> "$GITHUB_OUTPUT"
            echo "上游已更新，将编译最新固件。"
          fi

      - name: Record new upstream sha
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -eu
          echo "${{ steps.cmp.outputs.sha }}" > last-upstream-sha
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-upstream-sha
          git commit -m "chore: 记录上游框架指纹 ${{ steps.cmp.outputs.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: Build iNextOS image (LYT T68M / RK3568)
    needs: upstream
    # 手动触发 / push 时总是构建；定时任务只在上游有更新时构建
    # always()：上游指纹检查自身失败（403 / 网络抖动）不应该把 push / dispatch 触发的构建一起吞掉。
    if: always() && (github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          path: t68m

      - name: Checkout iNextOS build framework (armbian-easepi)
        uses: actions/checkout@v4
        with:
          repository: jjm2473/armbian-easepi
          ref: easepi-v26.02
          path: build

      - name: Inject LYT T68M board support
        run: |
          set -e
          cp -v t68m/config/boards/lyt-t68m.csc build/config/boards/
          mkdir -p build/patch/kernel/rk35xx-vendor-6.1/dt
          cp -v t68m/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-lyt-t68m.dts \
                build/patch/kernel/rk35xx-vendor-6.1/dt/
          echo "--- board config (lyt-t68m.csc):"
          cat build/config/boards/lyt-t68m.csc
          echo "--- dts head:"
          head -20 build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-lyt-t68m.dts
          echo "--- dts critical markers:"
          grep -nE '&pcie2x1|&sata2|&sdmmc2|lyt,t68m' \
                build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-lyt-t68m.dts || true

          # 升级 rk3568 的 DDR 初始化固件（这是修"完全无输出"的关键一步）。
          # 框架默认：rk35/rk3568_ddr_1560MHz_v1.21.bin
          #   → 已在构建产物里逐字节确认；该固件在 T68M 上 DDR 训练失败，
          #     而失败发生在串口初始化之前，故表现为上电后串口/HDMI 完全无输出。
          # armbian/rkbin 里 rk3568 可用的最新版本为 v1.23（1056MHz 档）：
          #   → 版本更新（新训练代码）+ 频率更保守（1056MHz），两者都指向能过训练。
          DDRINC=build/config/sources/families/include/rockchip64_common.inc
          n_before=$(grep -c 'rk3568_ddr_1560MHz_v1.21.bin' "$DDRINC" || true)
          sed -i 's#rk35/rk3568_ddr_1560MHz_v1.21.bin#rk35/rk3568_ddr_1056MHz_v1.23.bin#' "$DDRINC"
          n_after=$(grep -c 'rk35/rk3568_ddr_1056MHz_v1.23.bin' "$DDRINC" || true)
          echo "--- DDR 固件替换: 替换前命中 v1.21 行数=$n_before, 替换后 v1.23 行数=$n_after"
          [ "$n_after" -ge 1 ] || { echo "!! DDR 固件替换失败"; exit 1; }
          grep -n 'rk3568_ddr' "$DDRINC" | sed 's/^/    /'

      - name: Board DTS syntax gate
        # 板级 DTS 语法门（1 秒）—— 2026-10-28 run #62 的教训：手滑把
        # `poll-interval = <100>;` 写成 `poll-interval = 100>;`，dtc 要等到内核 make
        # 阶段才报 `rk3568-lyt-t68m.dts:51.19-22 syntax error`，白烧 3414 秒（57 分钟）。
        # 这类错在源码上是纯文本可判定的，这里 1 秒判死；真正的 dtc 编译仍由内核 make 兜底。
        run: |
          set -e
          echo "--- 板级 DTS 语法门（含判据自测）---"
          # 先跑判据自身的正/负例自测：负例不响 = 判据没在干活。
          # run #65 就是"只查括号配平、漏了属性在子节点之后"，白烧 3608 秒。
          python3 t68m/tools/dts-lint.py --selftest
          python3 t68m/tools/dts-lint.py t68m/patch/kernel/rk35xx-vendor-6.1/dt/*.dts
          echo "    ✅ 板级 DTS 语法形态通过"
          echo "--- GPT 元数据判据自测（写卡后必跑的那把工具的负例自测）---"
          # 镜像刷进比它大的 TF 卡后，备份 GPT/末可用扇区/保护 MBR count 全部失配：
          # U-Boot 宽容照过，内核严格拒表 → 卡上不出 p1 p2 → Waiting for root device。
          # 工具本身必须先带负例自测（正例 1 / 负例 2 / APPLY 2 / PARTUUID 1）。
          python3 t68m/tools/gpt-fix.py --selftest
          echo "    ✅ gpt-fix 判据自测通过"
          echo "--- 板级对齐判据自测（(2d-2) 的正/负例；run #73 就是这块把好 DTB 判死）---"
          python3 t68m/tools/board-parity-check.py --selftest
          echo "    ✅ board-parity 判据自测通过"

      # ── 包集合判据自身的正/负例自测（秒级；与 lyw-rr / lyw-hh 同一份代码）──
      - name: Self-test packages parity gate
        run: |
          set -e
          python3 t68m/tools/packages-parity-check.py --selftest

      - name: Fetch roceos web-UI payload into userpatches/overlay
        # 官方 iNextOS 镜像自带 roceos 网页后台（/opt/roceos + /opt/roceos-ai +
        # 3 个 systemd 服务 + nginx 站点与证书 + Flask 栈），本适配仓库原先缺这一整套，
        # 表现为板子能启动、但 192.168.100.1 只显示 nginx 默认欢迎页。
        # 这里把载荷经框架正规通道 userpatches/overlay（chroot 内即 /tmp/overlay）
        # 交给 customize-image.sh，在**构建阶段**装进镜像，而不是事后往镜像里替换文件。
        run: |
          set -e
          mkdir -p build/userpatches/overlay
          URL="https://github.com/linyueweia/lyw-OS/releases/download/roceos-payload-v2/roceos-payload.tar.gz"
          curl -fsSL -o build/userpatches/overlay/roceos-payload.tar.gz "$URL"
          # 载荷指纹固定断言：内容一旦变化立即失败，不留"以为改了其实没改"的余地。
          echo "cbd911c6fad5a3655bc52a39e4099b8812c70d8358840e1d1d8bf6db956703d1  build/userpatches/overlay/roceos-payload.tar.gz" | sha256sum -c -
          # 扩展放在 userpatches/extensions/ —— 框架会自动搜索并加载该目录（日志里能见到
          # "Extension search Directory .../build/userpatches/extensions"）。
          # 用扩展的 post_post_debootstrap_tweaks 钩子（官方 istorenext 扩展同款阶段）安装，
          # 而不是 customize-image.sh：实测后者建的 systemd 启用链接会被后续流程清掉。
          mkdir -p build/userpatches/extensions
          cp -v t68m/extensions/t68m-roceos.sh build/userpatches/extensions/
          # 关键：框架只加载【可执行】的扩展脚本，权限不对会被静默跳过
          # （日志表现：Extension search result [ Found 0 extensions ]）
          chmod +x build/userpatches/extensions/*.sh
          ls -l build/userpatches/extensions/
          ls -lh build/userpatches build/userpatches/overlay build/userpatches/extensions
          echo "--- 载荷关键文件抽查（含 WiFi 固件）:"
          tar tzf build/userpatches/overlay/roceos-payload.tar.gz \
            | grep -E 'opt/roceos/roceos$|opt/roceos/www/index.html|roceos-ai/server.py|roceos-ai/librkllmrt.so|system/roceos.*\.service|sites-available/roceos.conf|ssl/roceos.key|firmware/aic8800/sdio/fmacfw_8800d80_u02.bin'

      - name: Set up QEMU (binfmt_misc for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Build iNextOS image
        run: |
          cd build
          # 注释必须放在整条命令【之前】：放进 "\" 续行之间会把后续参数整段注释掉
          # （曾因此丢掉 KERNEL_CONFIGURE=no，框架弹出交互式菜单并以 error 43 失败）
          # ENABLE_EXTENSIONS 是扩展白名单（框架逐个 enable_extension），必须含自建扩展
          # BUILD_MINIMAL=yes —— 与官方 R1 发布件同口径（官方文件名正是
          #   iNextOSA_26.2.1_Easepi-r1_trixie_vendor_6.1.115_minimal.img.xz）。
          #   传 no 会装 framework 的 config/cli/<rel>/main/packages.additional 整份
          #   （avahi-autoipd / unattended-upgrades / vnstat / iperf3 / plymouth /
          #   dkms / rng-tools / build-essential …），实测装出 958 包，官方 minimal 是 718 包。
          #   其中 avahi-autoipd 会在 DHCP 失败时往网卡塞 169.254 链路本地地址、
          #   unattended-upgrades 会在后台升级并重启 dnsmasq/网络服务 —— 都会表现为
          #   “网口灯亮、下级设备拿不到 IP / 用几小时就掉”，与官方行为不一致。
          # COMPRESS_OUTPUTIMAGE 只出 sha,img（**不在这里压 xz**）：
          #   下一条 step 会挂载镜像改内容（roceos 载荷 / gpt-fix），改完框架那份 .xz 就失效，
          #   必须 rm 掉重压 —— 实测白压 109 秒 + 多写删 0.9GB（run #80 日志：
          #   07:55:53 开压 → 07:57:42 完成 → 07:58:24 re-compressing 又压一遍 400 秒）。
          #   压缩统一放在 post-process 末尾（唯一一次），产物仍是单层 .img.xz。
          ./compile.sh build \
            BOARD=lyt-t68m \
            BRANCH=vendor \
            RELEASE=trixie \
            ENABLE_EXTENSIONS="istorenext,t68m-roceos" \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE="sha,img" \
            SHARE_LOG=yes \
            EXPERT=yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-process image (verify armbian U-Boot / DTB / armbianEnv)
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -n1)
          [ -n "$IMG" ] || { echo "!! output image not found"; exit 1; }
          # (0a) 包集合必须与官方 minimal 同口径：镜像文件名带 _minimal 才说明
          #      BUILD_MINIMAL=yes 真生效（框架 rootfs-to-image.sh:21 用这个后缀）。
          case "$IMG" in
            *_minimal*) echo "    ✅ 镜像名含 _minimal（与官方 R1 发布件同口径）" ;;
            *) echo "!! 镜像名不含 _minimal：BUILD_MINIMAL 没有传 yes，会装进官方没有的一整批包"; exit 1 ;;
          esac
          echo "target image: $IMG"; ls -lh "$IMG"
          # (0b) GPT 自检：镜像若是 GPT，必须自洽（备份头落在镜像末尾）。
          #      本仓自 2026-10-28 起改为 msdos 表，工具会直接跳过并打印说明。
          python3 t68m/tools/gpt-fix.py "$IMG" || { echo "!! 镜像 GPT 元数据不自洽"; exit 1; }
          # (0c) 回归断言：分区表必须是 msdos（MBR）。
          #      改回 gpt 会让"镜像刷进更大的卡"重新变成必须人工修补的坑（备份头/last_usable/
          #      保护 MBR count 全按镜像大小算）—— 这类回归必须在这里就红。
          python3 - "$IMG" <<'PY'
          import sys
          f = open(sys.argv[1], 'rb')
          f.seek(512); sig = f.read(8)
          f.seek(446); mtype = f.read(16)[4]
          if sig == b'EFI PART' or mtype == 0xEE:
              sys.exit('!! 分区表是 GPT：写卡后需要人工修补备份头，已禁止（应为 IMAGE_PARTITION_TABLE="msdos"）')
          print('    ✅ 分区表 = msdos（MBR）—— 无备份头/末可用扇区可失配，写卡零步骤')
          PY

          # (0) 引导件来源校验：确认 idbloader 内嵌的 DDR 固件确实是升级后的版本。
          #     背景：框架 rockchip64_common.inc 默认 rk3568 用 rkbin 的
          #     rk3568_ddr_1560MHz_v1.21.bin —— 该版本在 T68M 上 DDR 训练失败
          #     （失败早于串口初始化，故表现为"上电后串口/HDMI 无任何输出"）。
          #     本工作流在构建前把默认值改为 v1.23（1056MHz），此处回读镜像自证。
          echo "--- (0) 校验镜像内嵌 DDR 固件 ---"
          sudo python3 - "$IMG" <<'PYEOF'
          import sys, hashlib, pathlib
          # 真机（T68M eMMC 实测提取）与厂商 iStoreOS 镜像内嵌的 DDR 固件，
          # 与 armbian/rkbin 的 rk3568_ddr_1056MHz_v1.23.bin 逐字节相同。
          # 该 sha256 取自官方 rkbin 仓库的同一文件，此处做精确指纹断言。
          EXPECT = '20e4bb076847bd019fcdeb7bdc15bd249890f07ecc76e9937101f22e50950982'
          with open(sys.argv[1], 'rb') as fh:
              fh.seek(0x8000)
              region = fh.read(0x36000 - 0x8000)      # 只读引导区，避免读入整个镜像
          hits = []
          for f in sorted(pathlib.Path('build/cache/sources/rkbin-tools/rk35').glob('rk3568_ddr_*.bin')):
              blob = f.read_bytes()
              off = region.find(blob)
              if off >= 0:
                  hits.append((f.name, off, len(blob)))
          for name, off, n in hits:
              print(f"  命中 {name} @ {hex(0x8000 + off)} ({n} 字节)")
          if not hits:
              sys.exit("  !! 镜像引导区内未找到任何已知 DDR 固件")
          if not any(h[0].startswith('rk3568_ddr_1056MHz_v1.23') for h in hits):
              sys.exit("  !! DDR 固件不是 rk3568_ddr_1056MHz_v1.23，升级未生效")
          name, off, n = [h for h in hits if h[0].startswith('rk3568_ddr_1056MHz_v1.23')][0]
          got = hashlib.sha256(region[off:off + n]).hexdigest()
          print(f"  内嵌固件 sha256 = {got[:32]}…")
          if got != EXPECT:
              sys.exit("  !! 内嵌 DDR 固件与真机同款固件指纹不一致")
          print("  ✅ DDR 固件 = 真机 eMMC 同款（rk3568_ddr_1056MHz_v1.23.bin）")
          PYEOF

          LOOP=$(sudo losetup -f --show -P "$IMG")
          echo "loop: $LOOP"

          # (1) bootloader 已在 (0) 处替换为 T68M 厂商引导件；此处仅回读校验魔数。
          echo "--- verify injected U-Boot FIT magic @8MiB:"
          sudo dd if="$LOOP" bs=1 skip=$((8*1024*1024)) count=4 status=none | xxd | head -1

          sudo mkdir -p /mnt/ib
          sudo mount ${LOOP}p1 /mnt/ib

          ROOT_UUID=$(sudo blkid -s UUID -o value ${LOOP}p2)
          echo "rootfs UUID: $ROOT_UUID"

          # (2) DTB: 只认 armbian/内核自己产出的那份（由本仓 DTS 补丁编译，时序与内核严格一致）。
          #     2026-10-17 移除仓库里的旧兜底件：kernel-files/*.dtb 是 rgmii-id 且无 tx/rx_delay 的
          #     历史件，一旦兜底生效会静默把千兆口时序改坏（56B 丢 65%、1400B 丢 90%）。
          #     产不出 DTB 说明构建异常，必须直接失败而不是塞旧件。
          if [ ! -f /mnt/ib/dtb/rockchip/rk3568-lyt-t68m.dtb ]; then
            echo "!! armbian 未产出 rk3568-lyt-t68m.dtb —— 构建异常，拒绝用仓库旧件兜底"; exit 1
          else
            echo "--- armbian-generated DTB kept as-is ---"
          fi
          ls -l /mnt/ib/dtb/rockchip/rk3568-lyt-t68m.dtb
          md5sum /mnt/ib/dtb/rockchip/rk3568-lyt-t68m.dtb

          # ── (2b)(2c)(2d)(2d-2)(2e) 全部 DTB 断言：单点化到 tools/board-parity-check.py ──
          #   为什么不再用 fdtget 字符串比较（run #73 的 4 条红全是判据写法，真 DTB 值全对）：
          #     ① `fdtget -t x` 输出**不带 0x 前缀**、gpios 第一格是随内核树变化的 phandle
          #        （本树 0x8b / 0x3f）⇒ 写死 "0x030x090x01" 会把**完全正确**的镜像判死；
          #     ② `fdtget -t s` 读 phandle 属性（非字符串）必然失败，`|| echo MISSING`
          #        把"存在"读成"缺失" ⇒ hdmi port@1 被误报缺失。
          #   ⇒ 判据绑语义：phandle 解析成节点名再比、数值按 cell 比，不写字面量。
          #   先由「DTB 校验」工作流（.github/workflows/dtb-verify.yml）对**真编 DTB** 跑到
          #   52/52 全绿，再进这里；本步是同一份判据对**镜像里的 DTB** 复核。
          DT=/mnt/ib/dtb/rockchip/rk3568-lyt-t68m.dtb
          echo "--- DTB 自证（判据 = tools/board-parity-check.py，共 52 条）---"
          python3 t68m/tools/board-parity-check.py "$DT" \
            || { echo "!! DTB 自证失败（见上面逐条 ❌）"; exit 1; }
          dfail=0

          # 更新防护：apt 禁止清单 + 空壳固件包 + ttyFIQ0 getty 屏蔽
          # （roceos 的更新流程会装发行版固件包，与 armbian-firmware 冲突并把它连同
          #   WiFi 固件一起删掉，实测过；这两项让该流程无法再造成破坏）
          #
          # 注意：这三项全在【根分区】(p2)，不能像 DTB 那样用 boot 分区挂载点查。
          #      早先误用未赋值的 $R，"$PROT/etc/..." 退化成宿主机 /etc/... ，于是永远报缺失。
          PROT=/mnt/pr
          sudo mkdir -p "$PROT"
          sudo mount "${LOOP}p2" "$PROT"
          if grep -q '^Pin-Priority: -1' "$PROT/etc/apt/preferences.d/10-inextos-firmware-conflict" 2>/dev/null; then
            echo "    ✅ apt 禁止清单(10-inextos-firmware-conflict) 就位"
          else
            echo "    ❌ 缺少 apt 禁止清单，更新流程可能再次删除 armbian-firmware"; dfail=1
          fi
          # 与 TF 卡（已验收完美）逐项一致：9 个同名空壳固件包，版本一律带 +inextos1
          for p in firmware-ath9k-htc firmware-atheros firmware-carl9170 firmware-iwlwifi \
                   firmware-libertas firmware-mediatek firmware-misc-nonfree firmware-sof-signed \
                   firmware-ti-connectivity; do
            if awk -v pkg="$p" '/^Package: /{cur=$2} /^Version: /{if(cur==pkg && $2 ~ /\+inextos1$/){found=1}} END{exit !found}' \
                 "$PROT/var/lib/dpkg/status" 2>/dev/null; then
              echo "    ✅ 空壳固件包 ${p} (+inextos1)"
            else
              echo "    ❌ 缺少空壳固件包 ${p}（依赖检查会失败并触发危险安装）"; dfail=1
            fi
          done
          if [ -L "$PROT/etc/systemd/system/serial-getty@ttyFIQ0.service" ]; then
            echo "    ✅ ttyFIQ0 getty 已屏蔽"
          else
            echo "    ❌ ttyFIQ0 getty 未屏蔽（启动会等设备超时）"; dfail=1
          fi

          # ── 网络栈对齐官方标准（出厂不带 NetworkManager）+ 唯一自定义 .default-network=eth0 ──
          # 必须在 $PROT 挂载窗口内：umount 之后会退化成查宿主机根目录而误判（见 562dfc4）。
          if [ -e "$PROT/usr/sbin/NetworkManager" ] || [ -e "$PROT/usr/bin/nmcli" ]; then
            echo "    ❌ NetworkManager 二进制仍在（未对齐官方标准）"; dfail=1
          fi
          for p in network-manager network-manager-openvpn netplan.io chrony; do
            if grep -q "^Package: ${p}\$" "$PROT/var/lib/dpkg/status" 2>/dev/null; then
              echo "    ❌ 多余网络包 ${p}（官方标准镜像不含）"; dfail=1
            fi
          done
          # 与官方 minimal 同口径：framework 的 packages.additional 整份不得进镜像。
          # 官方 R1 发布件实测 718 包、我们旧构建 958 包，差的就是这批。
          # 危害最直接的两个：avahi-autoipd（DHCP 失败时塞 169.254 地址）、
          # unattended-upgrades（后台升级并重启 dnsmasq/网络服务）。
          # 判据单点 = tools/packages-parity-check.py（来源减法；与 lyw-rr / lyw-hh / lyw-kk 同一份）。
          # packages.additional 的成员有四个【官方 minimal 也有】的合法来源（框架三层 base 清单 /
          # istorenext 的 add_packages_to_image / 依赖传递 / apt auto）—— 官方 A2 2.9.1 镜像实测那
          # 15 个成员官方全都有，「出现即红」是假判据。这里只判「没有任何来源」的成员。
          if [ -d "$GITHUB_WORKSPACE/build/config/cli" ]; then
            export BUILD_TREE="$GITHUB_WORKSPACE/build"
            PACKAGES_EXTENSION_FILES="$(printf '%s ' $GITHUB_WORKSPACE/build/extensions/istorenext.sh $GITHUB_WORKSPACE/build/userpatches/extensions/*.sh)"
            export PACKAGES_EXTENSION_FILES
            if ! python3 t68m/tools/packages-parity-check.py --root "$PROT" --build-tree "$BUILD_TREE" --release "${RELEASE:-trixie}" --arch arm64 $(for f in $PACKAGES_EXTENSION_FILES; do echo --extension "$f"; done); then
              echo "    ❌ 包集合与官方 minimal 口径不一致（上述包没有任何合法来源）"; dfail=1
            fi
          else
            echo '    !! 没有构建树，包集合口径无法核对（不给假绿）'; dfail=1
          fi
          if [ -e "$PROT/etc/systemd/system/multi-user.target.wants/NetworkManager.service" ]; then
            echo "    ❌ NetworkManager 仍被启用"; dfail=1
          fi
          if [ -e "$PROT/etc/NetworkManager/NetworkManager.conf" ] || [ -d "$PROT/etc/netplan" ]; then
            echo "    ❌ NM/netplan 配置残留"; dfail=1
          fi
          # 官方网络栈必须在位
          for s in networking dnsmasq; do
            if [ -L "$PROT/etc/systemd/system/multi-user.target.wants/${s}.service" ]; then
              echo "    ✅ ${s}.service 启用"
            else
              echo "    ❌ ${s}.service 未启用（官方网络栈缺失）"; dfail=1
            fi
          done

          # smartmontools 必须「包在、不启用」= 官方 R1 口径（2026-10-29 实机取证）。
          # 官方 R1 发布件里该包存在，但 multi-user.target.wants 里没有启用链接；
          # 我们的镜像曾因 Debian preset 在构建期自动生成链接，开机必 failed
          #（eMMC 不支持 SMART，smartd 退出码 17），实机 enable 链 mtime 早于开机时刻。
          # 构建期由 csc 的 post_family_tweaks__lyt_t68m_disable_smartmontools 删链，
          # 此处反向断言把关：链接不得出现（防 preset 复活 / 后续步骤重新 enable）。
          if [ -e "$PROT/etc/systemd/system/multi-user.target.wants/smartmontools.service" ] ||
             [ -L "$PROT/etc/systemd/system/multi-user.target.wants/smartmontools.service" ]; then
            echo "    ❌ smartmontools 被启用（官方 R1 不启用，开机必 failed）"; dfail=1
          else
            echo "    ✅ smartmontools 未启用（与官方 R1 一致：包在、不启用）"
          fi
          # 反向中的反向：包本身必须还在。官方 R1 同样发行这个包 —— 卸载它是自造差异，不是对齐官方。
          if ! grep -q "^Package: smartmontools$" "$PROT/var/lib/dpkg/status" 2>/dev/null; then
            echo "    ❌ smartmontools 包缺失（官方 R1 发行该包，应只 disable 不要卸载）"; dfail=1
          fi
          if [ -L "$PROT/etc/systemd/system/networking.service.wants/istorenext-init-network.service" ]; then
            echo "    ✅ istorenext-init-network 挂接 networking.service"
          else
            echo "    ❌ istorenext-init-network 未挂 networking.service"; dfail=1
          fi
          if grep -q 'KERNELS=="fe2a0000.ethernet", NAME:="eth0"' "$PROT/etc/udev/rules.d/70-persistent-net.rules" 2>/dev/null; then
            echo "    ✅ udev 网卡命名（eth0=fe2a0000）"
          else
            echo "    ❌ udev 网卡命名规则缺失/错误"; dfail=1
          fi
          # 唯一自定义项（/root 是 0700，本步骤 runner 是非 root：cat 必须 sudo，
          # 否则被权限拦下、2>/dev/null 吞掉报错输出空串 → 误判失败。/etc 是 755
          # 所以同块其他断言当时能过 —— 踩过一次，两个 cat 一律 sudo）
          if [ "$(sudo cat "$PROT/root/.default-network" 2>/dev/null)" = "DEFAULT_INTERFACE=eth0" ]; then
            echo "    ✅ .default-network = DEFAULT_INTERFACE=eth0（唯一自定义）"
          else
            echo "    ❌ .default-network 不是 DEFAULT_INTERFACE=eth0（缺 sudo？/root=0700）"; dfail=1
          fi
          if [ "$(sudo cat "$PROT/etc/eth_order" 2>/dev/null)" = "fe2a0000.ethernet,fe010000.ethernet,0002:21:00.0,0001:11:00.0" ]; then
            echo "    ✅ /etc/eth_order 顺序表"
          else
            echo "    ❌ /etc/eth_order 内容不符"; dfail=1
          fi
          # 网卡配置全部在 DTS 里（见 (2d)，官方写法）⇒ 镜像中不得再有任何网卡运行时补丁件：
          # GRF 直写(旧 gmac-delay)、EEE 关闭(旧 eth-eee-off / r8125-eee.conf)、
          # gpioset 常驻(旧 gmac-phy-hold) —— 官方板级里都没有这些。
          for f in usr/local/sbin/t68m-gmac-delay usr/local/sbin/t68m-eee-off \
                   etc/systemd/system/t68m-gmac-delay.service \
                   etc/systemd/system/eth-eee-off.service \
                   etc/systemd/system/gmac-phy-hold.service \
                   etc/modprobe.d/r8125-eee.conf; do
            if [ -e "$PROT/${f}" ]; then
              echo "    ❌ 仍有网卡运行时补丁件 $f（应只由 DTS 承担）"; dfail=1
            else
              echo "    ✅ 无 $f"
            fi
          done
          # 官方 R1 镜像自带 /usr/sbin/ethtool（本仓不额外装，但必须在位以便现场取证）
          if [ -x "$PROT/usr/sbin/ethtool" ]; then
            echo "    ✅ ethtool 在位（与官方基线一致）"
          else
            echo "    ❌ ethtool 缺失（与官方基线不一致）"; dfail=1
          fi
          for u in eth-eee-off.service t68m-gmac-delay.service gmac-phy-hold.service; do
            if [ -L "$PROT/etc/systemd/system/multi-user.target.wants/$u" ]; then
              echo "    ❌ wants 里仍有 $u 的启用链接"; dfail=1
            else
              echo "    ✅ wants 里无 $u"
            fi
          done
          [ "$dfail" = 0 ] || { echo "!! 网络栈对齐官方标准 / .default-network / 链路稳定性自证失败"; exit 1; }
          echo "    ✅ 网络栈对齐官方标准 + .default-network=eth0 + eth0/eth1 链路稳定性自证通过"

          sudo umount "$PROT"

          # USB3 glue 父节点（/usbdrd /usbhost）的 status 断言已并入
          # tools/board-parity-check.py 的 (2b) 组，不再在这里重复一份字面量。

          # (3) armbianEnv.txt: keep armbian's own file (it has overlays,
          #     usbstoragequirks, etc). Only append what is missing; never overwrite.
          if [ -f /mnt/ib/armbianEnv.txt ]; then
            grep -q '^fdtfile=' /mnt/ib/armbianEnv.txt || echo "fdtfile=rockchip/rk3568-lyt-t68m.dtb" | sudo tee -a /mnt/ib/armbianEnv.txt >/dev/null
            grep -q '^rootdev=' /mnt/ib/armbianEnv.txt || echo "rootdev=UUID=${ROOT_UUID}" | sudo tee -a /mnt/ib/armbianEnv.txt >/dev/null
          else
            echo "!! armbianEnv.txt missing; generating a minimal one"
            {
              echo "verbosity=1"
              echo "bootlogo=false"
              echo "console=both"
              echo "extraargs=cma=256M"
              echo "overlay_prefix=rk35xx"
              echo "fdtfile=rockchip/rk3568-lyt-t68m.dtb"
              echo "rootdev=UUID=${ROOT_UUID}"
              echo "rootfstype=ext4"
            } | sudo tee /mnt/ib/armbianEnv.txt >/dev/null
          fi

          echo "--- armbianEnv.txt ---"; cat /mnt/ib/armbianEnv.txt
          echo "--- DTB ---"; ls -l /mnt/ib/dtb/rockchip/rk3568-lyt-t68m.dtb
          md5sum /mnt/ib/dtb/rockchip/rk3568-lyt-t68m.dtb

          sync
          sudo umount /mnt/ib

          # (4) roceos 网页后台自证：应用本体 / 服务启用 / nginx 站点 / Flask 栈。
          #     背景：官方镜像自带这一整套；缺了它 192.168.100.1 只显示 nginx 欢迎页。
          #     本工作流经 userpatches/extensions/t68m-roceos.sh（框架可用扩展）在构建阶段注入，此处回读自证。
          echo "--- (4) 校验 roceos 网页后台（构建阶段注入结果） ---"
          sudo mkdir -p /mnt/ir
          sudo mount ${LOOP}p2 /mnt/ir
          rfail=0
          for f in opt/roceos/roceos opt/roceos/www/index.html opt/roceos-ai/server.py \
                   opt/roceos-ai/librkllmrt.so \
                   etc/systemd/system/roceos.service etc/systemd/system/roceos-ai.service \
                   etc/systemd/system/roceos-vision.service \
                   etc/nginx/sites-available/roceos.conf etc/nginx/ssl/roceos.crt etc/nginx/ssl/roceos.key; do
            if [ -e "/mnt/ir/$f" ]; then printf "    ✅ %s\n" "$f"; else printf "    ❌ 缺 %s\n" "$f"; rfail=1; fi
          done
          # 三个启用链接必须用 -L：它们是符号链接，目标是镜像内绝对路径
          # /etc/systemd/system/*.service，用 -e 会跟随链接、在宿主机上解析失败而误判缺失。
          for s in roceos roceos-ai roceos-vision; do
            if [ -L "/mnt/ir/etc/systemd/system/multi-user.target.wants/${s}.service" ]; then
              printf "    ✅ %s.service 已启用\n" "$s"
            else
              printf "    ❌ %s.service 未启用\n" "$s"; rfail=1
            fi
          done
          if [ -L /mnt/ir/etc/nginx/sites-enabled/roceos.conf ]; then
            echo "    ✅ nginx 站点已启用"; else echo "    ❌ nginx 站点未启用"; rfail=1; fi
          if [ -L /mnt/ir/etc/nginx/sites-enabled/default ] || [ -e /mnt/ir/etc/nginx/sites-enabled/default ]; then
            echo "    ❌ default 站点仍在（与 roceos.conf 抢 default_server，nginx 会起不来）"; rfail=1
          else
            echo "    ✅ default 站点已移除"
          fi
          for f in lib/firmware/aic8800/sdio/fmacfw_8800d80_u02.bin \
                   lib/firmware/aic8800/SDIO/aic8800D80/fmacfw_8800d80_u02.bin; do
            if [ -e "/mnt/ir/$f" ]; then printf "    ✅ %s\n" "$f"; else printf "    ❌ 缺 %s\n" "$f"; rfail=1; fi
          done
          echo "--- 主程序架构:"; file /mnt/ir/opt/roceos/roceos | sed 's/^/    /'
          echo "--- Flask 栈（chroot 实测导入，依赖前面注册的 QEMU binfmt）:"
          sudo chroot /mnt/ir /usr/bin/python3 -c "import importlib.metadata as md; print('    ' + ' '.join(f'{p}={md.version(p)}' for p in ('flask','werkzeug','jinja2','itsdangerous','markupsafe','blinker')))" \
            || { echo "    !! Flask 栈不可导入"; rfail=1; }
          sudo umount /mnt/ir
          [ "$rfail" = 0 ] || { echo "!! roceos 网页后台自证失败"; exit 1; }
          echo "    ✅ roceos 网页后台自证通过"

          sudo losetup -d "$LOOP"

          # 收尾：GPT 元数据自洽化 + 复检（与飞牛线 `buildfnos.sh:317` 同一做法）。
          # 理由：镜像被挂载/改动过之后，备份头/末可用扇区/保护 MBR count 都必须与
          # **当前文件大小**重新对齐；工具自身带 --selftest（构建开头已跑过）。
          # 注意这只保证"镜像自洽"，**不等于"刷进更大的卡就能起"**：
          #   写卡后必须再跑 `python3 tools/gpt-fix.py <卡> --apply --renew-partuuid=2`。
          python3 t68m/tools/gpt-fix.py "$IMG" --apply || { echo "!! 镜像 GPT 自洽化失败"; exit 1; }

          # 唯一一次压缩：镜像在本 step 里被改过（roceos 载荷 / gpt-fix），所以必须在改完之后压。
          # 顺序不能换：xz 成功后原始 .img 会被删 → 必须「先算 .img 校验 → 再压缩 → 最后算 .xz 校验」。
          # 上一版把 .img 的 sha256 放在压缩之后，报过 "No such file or directory"。
          # 这里不再用 `if [ -f "${IMG}.xz" ]` 守卫：框架已改为 COMPRESS_OUTPUTIMAGE="sha,img"（不预压），
          # 无条件执行才是唯一一次压缩；`rm -f` 保留以防框架哪天又自己出一份 .xz。
          IMGDIR="$(cd "$(dirname "${IMG}")" && pwd)"; IMGBASE="$(basename "${IMG}")"
          echo "--- 先按当前内容重算 .img 校验（镜像被改动过，armbian 原值可能已过期）"
          sudo sh -c "cd '${IMGDIR}' && sha256sum '${IMGBASE}' > '${IMGBASE}.sha'"
          echo "compressing (唯一一次)..."; rm -f "${IMG}.xz"; sudo xz -T0 "${IMG}"; ls -lh "${IMG}.xz"
          echo "--- 压缩后重算 .xz 校验"
          sudo sh -c "cd '${IMGDIR}' && sha256sum '${IMGBASE}.xz' > '${IMGBASE}.xz.sha'"
          echo "--- 最终校验文件:"
          sudo sh -c "cat '${IMGDIR}/${IMGBASE}.sha' '${IMGDIR}/${IMGBASE}.xz.sha'"

      - name: Show outputs
        if: always()
        run: |
          echo "=== output tree ==="
          find build/output -maxdepth 3 -type f 2>/dev/null | head -50 || true

      - name: Upload iNextOS artifacts
        if: always()
        # 只打包压缩版：raw .img 与 .img.xz 内容等价（raw 里全是零字节区，
        # zip 再压一遍纯属浪费带宽/存储/下载时间），刷机也只用 xz。
        uses: actions/upload-artifact@v4
        with:
          name: inextos-lyt-t68m
          path: |
            build/output/images/*.img.xz
            build/output/images/*.sha
            build/output/debs/*.deb
          if-no-files-found: warn
          retention-days: 14
